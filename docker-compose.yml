services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: polyabrain
      POSTGRES_USER: polyabrain
      POSTGRES_PASSWORD: polyabrain
    ports:
      - "127.0.0.1:${POLYABRAIN_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyabrain -d polyabrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${POLYABRAIN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POLYABRAIN_ENV: ${POLYABRAIN_ENV:-local}
      POLYABRAIN_AUTH_REQUIRED: ${POLYABRAIN_AUTH_REQUIRED:-false}
      POLYABRAIN_PUBLIC_ORIGIN: ${POLYABRAIN_PUBLIC_ORIGIN:-}
      POLYABRAIN_SECRET_KEY: ${POLYABRAIN_SECRET_KEY:-}
      POLYABRAIN_AUTH_SESSION_SECONDS: ${POLYABRAIN_AUTH_SESSION_SECONDS:-3600}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      POLYABRAIN_DAILY_USER_RUN_LIMIT: ${POLYABRAIN_DAILY_USER_RUN_LIMIT:-20}
      POLYABRAIN_DAILY_GLOBAL_RUN_LIMIT: ${POLYABRAIN_DAILY_GLOBAL_RUN_LIMIT:-100}
      POLYABRAIN_CONCURRENT_USER_RUN_LIMIT: ${POLYABRAIN_CONCURRENT_USER_RUN_LIMIT:-1}
      POLYABRAIN_CONCURRENT_GLOBAL_RUN_LIMIT: ${POLYABRAIN_CONCURRENT_GLOBAL_RUN_LIMIT:-4}
      POLYABRAIN_LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://polyabrain:polyabrain@postgres:5432/polyabrain
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
    ports:
      - "127.0.0.1:${POLYABRAIN_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      POLYABRAIN_API_URL: http://backend:8000
      POLYABRAIN_PUBLIC_ORIGIN: ${POLYABRAIN_PUBLIC_ORIGIN:-}
    ports:
      - "127.0.0.1:${POLYABRAIN_UI_PORT:-3010}:3010"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/backend/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
