name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - "feature/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Verify pre-platform proof artifacts
        run: make proof
