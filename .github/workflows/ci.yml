name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - "feature/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Prepare pinned code execution sandbox
        run: docker pull python:3.14-alpine@sha256:a1321512d6a287428c50dcdf2ab3857761127e03a23b1f648e9c1c0de59288f8

      - name: Test
        run: make test

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Verify pre-platform proof artifacts
        run: make proof

      - name: Verify Chapter 11 prompt and parser examples
        run: make chapter11-proof

  database-baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: polyabrain
          POSTGRES_USER: polyabrain
          POSTGRES_PASSWORD: polyabrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyabrain -d polyabrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://polyabrain:polyabrain@localhost:5432/polyabrain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run migrations
        run: make migrate

      - name: Run database integration tests
        run: make db-test

      - name: Run database smoke check
        run: make db-smoke
